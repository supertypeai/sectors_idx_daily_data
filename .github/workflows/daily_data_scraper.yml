
name: Daily Data Scraper

on:
  # Primary trigger lives in cron-job.org (calls workflow_dispatch via GitHub REST API).
  # GH Actions cron suffered 3-5h queue drift on the 11:00 UTC slot; cron-job.org
  # gives sub-minute precision so the scrape lands at 18:00 WIB sharp.
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional target date (YYYY-MM-DD). Defaults to today (Asia/Jakarta).'
        required: false
  # 18:00 UTC = 01:00 WIB Tue-Sat. GH queue drift on this slot runs 3-6h, so it lands
  # ~04:00-06:42 WIB; the target is still "yesterday in Asia/Jakarta" (day-1 in WIB),
  # which is the trading day that just closed. A run with zero drift at 01:00 WIB is
  # also fine: IDX publishes the day-1 summary after the ~16:00 WIB close.
  schedule:
    - cron: '0 18 * * 1-5'

concurrency:
  group: daily-scraper
  cancel-in-progress: false
      

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      
    - name: Resolve target date
      id: target
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          DATE=$(TZ=Asia/Jakarta date -d yesterday +%F)   # 04:00 WIB -> day-1
        elif [ -n "${{ inputs.date }}" ]; then
          DATE="${{ inputs.date }}"
        else
          DATE=$(TZ=Asia/Jakarta date +%F)                # 18:00 WIB -> today
        fi
        echo "run_date=$DATE" >> "$GITHUB_OUTPUT"
        echo "Target date: $DATE"

    # Re-scrape day-1 only when the 18:00 run left it missing or incomplete; otherwise repair alone.
    - name: Check if target date is missing
      id: check
      if: github.event_name == 'schedule'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        BASE="$SUPABASE_URL/rest/v1/idx_daily_data"
        AUTH=(-H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
        count_for() {
          curl -s "$BASE?date=eq.$1&select=symbol" "${AUTH[@]}" \
            -H "Prefer: count=exact" -H "Range: 0-0" -o /dev/null -D - \
            | grep -i content-range | sed 's#.*/##' | tr -d '\r' || true
        }

        TARGET="${{ steps.target.outputs.run_date }}"
        COUNT=$(count_for "$TARGET")

        # Expected size = the previous trading day with rows, so a partial write is visible
        PREV=$(curl -s "$BASE?date=lt.$TARGET&select=date&order=date.desc&limit=1" "${AUTH[@]}" \
          | grep -o '"date":"[0-9-]*"' | head -1 | cut -d'"' -f4 || true)
        EXPECTED=0
        if [ -n "$PREV" ]; then
          PREV_COUNT=$(count_for "$PREV")
          if [[ "$PREV_COUNT" =~ ^[0-9]+$ ]]; then EXPECTED=$PREV_COUNT; fi
        fi

        # non-numeric COUNT (curl/HTTP error) -> assume missing so the safety net still fires
        if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
          MISSING=true
        elif [ "$EXPECTED" -eq 0 ]; then
          MISSING=$([ "$COUNT" -gt 0 ] && echo false || echo true)   # nothing to compare against yet
        elif [ "$COUNT" -lt "$EXPECTED" ]; then
          MISSING=true   # empty or partial day (harvest stopped before the full universe)
        else
          MISSING=false
        fi
        echo "$TARGET rows=$COUNT expected=$EXPECTED (from $PREV) missing=$MISSING"
        echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

    - name: Run Daily Data Scraper
      if: github.event_name == 'workflow_dispatch' || steps.check.outputs.missing == 'true'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PROXY_URL: ${{ secrets.PROXY_URL }}
      run: python idx_daily_updater.py "${{ steps.target.outputs.run_date }}"

    # Fills open/high/low left at 0 by IDX. Scrape-free, parallel, writes with the service key.
    # --with-prev also repairs the previous TRADING day (resolved from the DB, not calendar).
    - name: IQPlus repair (open/high/low)
      if: github.event_name == 'schedule'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python iqplus_repair.py "${{ steps.target.outputs.run_date }}" --with-prev --apply
   
    - name: commit files
      run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "updated logs" --allow-empty)
          
    - name: push changes
      uses: ad-m/github-push-action@v0.6.0
      with:
        github_token: ${{ secrets.TOKEN_GITHUB }}
        branch: main 
